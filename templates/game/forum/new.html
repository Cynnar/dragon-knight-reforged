{% extends "base.html" %}
{% block title %}New Thread — Forum{% endblock %}
{% block content %}
<div class="panel form-panel">
  <p><a href="{% url 'forum_index' %}">← Forum</a></p>
  <h1>Start a new thread</h1>
  <form method="post" action="{% url 'forum_new' %}">
    {% csrf_token %}
    <p>
      <label for="title">Title</label>
      <input type="text" name="title" id="title" maxlength="100" />
    </p>
    <p>
      <label for="content">Message</label>
      <textarea name="content" id="content" rows="7"></textarea>
    </p>
    <button class="btn" type="submit">Post thread</button>
  </form>
</div>
{% endblock %}
