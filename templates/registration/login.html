{% extends "base.html" %}

{% block title %}Log in — Dragon Knight{% endblock %}

{% block content %}
<div class="panel form-panel">
  <h1>Log in</h1>
  {% if form.errors %}
    <p class="form-error">That username and password didn't match. Try again.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{% url 'signup' %}">Create one</a>.</p>
</div>
{% endblock %}
